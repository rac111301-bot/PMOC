<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMOC Control Pro &bull; Gestão, Laudos e Recibos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Biblioteca jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none !important; border: none !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Cabeçalho Principal -->
    <header class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white shadow-lg py-5 px-6">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-inner border border-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wide bg-gradient-to-r from-white to-blue-200 bg-clip-text text-transparent">PMOC Control Pro</h1>
                    <p class="text-xs text-blue-200 font-medium">Gestão de Climatização, PMOC, Laudos e Recibos</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs bg-blue-700/60 border border-blue-500/40 px-3 py-1.5 rounded-full font-medium tracking-wide shadow-sm">
                    Versão Web GitHub Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Navegação por Abas -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
        <div class="container mx-auto px-4 flex gap-2 sm:gap-6 overflow-x-auto">
            <button onclick="mudarAba('pmoc')" id="tab-pmoc" class="py-3.5 px-4 font-bold text-sm border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 transition whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                Gestão PMOC & Equipamentos
            </button>
            <button onclick="mudarAba('laudos')" id="tab-laudos" class="py-3.5 px-4 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 transition whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                Laudos Técnicos
            </button>
            <button onclick="mudarAba('recibos')" id="tab-recibos" class="py-3.5 px-4 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 transition whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                Recibos de Serviços
            </button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-grow container mx-auto px-4 py-8">

        <!-- SEÇÃO 1: PMOC & EQUIPAMENTOS -->
        <div id="secao-pmoc" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulário -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 lg:col-span-1 h-fit">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                        <h2 id="formTitulo" class="text-lg font-bold text-slate-800">Cadastrar Equipamento</h2>
                    </div>
                    <button type="button" id="btnCancelarEdicao" onclick="resetarFormulario()" class="text-xs text-rose-500 hover:underline hidden">Cancelar</button>
                </div>
                
                <form id="pmocForm" class="space-y-4">
                    <input type="hidden" id="editId">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nome da Empresa / Cliente</label>
                        <input type="text" id="empresa" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition text-sm" placeholder="Ex: Supermercado Central">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">WhatsApp do Cliente (Com DDD)</label>
                        <input type="text" id="whatsapp" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition text-sm" placeholder="Ex: 5585999998888">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Identificação / Tag do Equipamento</label>
                        <input type="text" id="equipamento" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition text-sm" placeholder="Ex: Split Inverter 24.000 BTUs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Localização / Setor</label>
                        <input type="text" id="local" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition text-sm" placeholder="Ex: Sala de Reuniões - 2º Andar">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Periodicidade da Manutenção</label>
                        <select id="periodicidade" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition text-sm">
                            <option value="Mensal">Mensal</option>
                            <option value="Trimestral">Trimestral</option>
                            <option value="Semestral">Semestral</option>
                        </select>
                    </div>
                    <button type="submit" id="btnSalvar" class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-blue-500/20 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Salvar Equipamento
                    </button>
                </form>
            </section>

            <!-- Painel QR Code e Lista -->
            <section class="lg:col-span-2 space-y-6">
                <!-- Área QR Code / Impressão -->
                <div id="printable-area" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col items-center justify-center text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-500"></div>
                    
                    <h3 class="text-base font-bold text-slate-800 mb-1 mt-2">Etiqueta Inteligente QR Code</h3>
                    <p class="text-xs text-slate-500 mb-5">Fixação recomendada no gabinete do equipamento para vistorias rápidas.</p>
                    
                    <div id="qrcode-container" class="p-4 bg-white border-2 border-dashed border-slate-200 rounded-2xl shadow-sm relative flex flex-col items-center justify-center min-h-[170px] min-w-[170px]">
                        <div class="text-slate-400 text-xs flex flex-col items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
                            <span>Selecione um equipamento abaixo</span>
                        </div>
                    </div>
                    
                    <div id="qr-info" class="mt-4 text-xs text-slate-600 hidden space-y-0.5 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-100">
                        <p id="info-empresa" class="font-bold text-slate-800 text-sm"></p>
                        <p id="info-equipamento" class="text-slate-600"></p>
                        <p id="info-local" class="text-slate-500"></p>
                    </div>

                    <div class="no-print mt-6 flex gap-3 flex-wrap justify-center">
                        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                            Imprimir Etiqueta
                        </button>
                        <button id="btnRelatorio" onclick="gerarRelatorioPMOC()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5 hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4
